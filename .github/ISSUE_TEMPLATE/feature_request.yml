name: Feature request
description: Suggest an improvement for photo_gallery_gdx_plus
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the community-maintained package.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or use case should this feature address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API or behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative designs.
  - type: dropdown
    id: platforms
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - iOS
        - Dart API / both platforms
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: I understand that a feature request is not a commitment or release estimate.
          required: true
